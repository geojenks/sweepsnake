name: Sync results

# Pulls World Cup results from football-data.org into Supabase.
on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes during the tournament
  workflow_dispatch: {}      # manual "Run workflow" button

# Avoid overlapping runs.
concurrency:
  group: sync-results
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit the bracket snapshot back to the repo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Sync
        env:
          # The only required secret. Supabase URL + (anon) key default to the
          # public values in js/config.js, so nothing else needs configuring.
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          # Optional overrides — only set these if you want to use the service_role
          # key instead of the public anon key:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/sync.mjs

      # sync.mjs rewrites data/bracket-results.json (the public bracket's feed).
      # It only changes on a real knockout event, so most runs commit nothing.
      - name: Commit bracket snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bracket-results.json
          if git diff --cached --quiet; then
            echo "No bracket change — nothing to commit."
          else
            git commit -m "chore: bracket results snapshot [skip ci]"
            git pull --rebase --autostash
            git push
          fi
