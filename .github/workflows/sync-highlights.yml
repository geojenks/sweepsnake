name: Sync highlights

# Searches YouTube for World Cup highlight clips and caches video IDs in
# data/highlights.json, which the static site reads at runtime.
on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC = 08:00 BST — runs each morning
  workflow_dispatch: {}    # manual trigger from Actions tab

concurrency:
  group: sync-highlights
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit highlights.json back to the repo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Sync highlights
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # Supabase defaults to public anon values in the script; override if needed:
          # SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/sync-highlights.mjs

      - name: Commit updated highlights
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/highlights.json
          if git diff --cached --quiet; then
            echo "No new highlights found — nothing to commit."
          else
            git commit -m "chore: update highlights cache [skip ci]"
            git pull --rebase --autostash
            git push
          fi
