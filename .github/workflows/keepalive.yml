name: Supabase keep-alive

# Supabase free tier pauses after 7 days of inactivity. A tiny read every 5 days
# keeps the project awake.
on:
  schedule:
    - cron: "0 12 */5 * *"   # every 5 days at noon UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/config?select=key&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            && echo "  -> Supabase is awake"
