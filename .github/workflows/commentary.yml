name: Daily commentary

# Each morning, refresh results then write up the last completed game day in the
# LPS pundit voice (via the Claude API) and commit it to data/commentary.json,
# which commentary.html reads at runtime.
on:
  schedule:
    - cron: "0 9 * * *"    # 09:00 UTC = 10:00 BST — after the overnight US games are in
  workflow_dispatch:        # manual trigger from the Actions tab
    inputs:
      days:
        description: "Set to 'all' to backfill every uncovered game day"
        required: false
        default: ""

concurrency:
  group: commentary
  cancel-in-progress: false

jobs:
  commentary:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit commentary.json back to the repo
    env:
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check ANTHROPIC_API_KEY secret
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is empty or not set"
            exit 1
          fi
          echo "ANTHROPIC_API_KEY is set (length: ${#ANTHROPIC_API_KEY})"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Pull the freshest scores into Supabase first (no-op if FOOTBALL_DATA_API_KEY
      # is unset — the scheduled sync.yml keeps results current regardless).
      - name: Sync results
        if: ${{ env.FOOTBALL_DATA_API_KEY != '' }}
        run: node scripts/sync.mjs

      - name: Write commentary
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DAYS: ${{ github.event.inputs.days }}
        run: node scripts/commentary.mjs

      - name: Commit new commentary
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/commentary.json
          if git diff --cached --quiet; then
            echo "No new commentary — nothing to commit."
          else
            git commit -m "chore: daily commentary update [skip ci]"
            git pull --rebase --autostash
            git push
          fi
